<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Control de Entrega Escolar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body {
    background-color: #0F172A;
    min-height: 100vh;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* PANEL SUPERIOR DE BÚSQUEDA */
  .search-panel {
    width: 100%;
    max-width: 480px;
    background: #1E293B;
    padding: 16px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    border: 1px solid #334155;
  }
  .search-panel h3 {
    color: #F8FAFC;
    font-size: 14px;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .search-box {
    display: flex;
    gap: 8px;
  }
  .search-input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #475569;
    background: #0F172A;
    color: #FFFFFF;
    font-size: 14px;
    outline: none;
  }
  .search-input:focus {
    border-color: #38BDF8;
  }
  .search-btn {
    background: #0284C7;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
  }
  .search-btn:hover { background: #0369A1; }

  /* LISTA DE RESULTADOS / ACCESOS RÁPIDOS */
  .quick-list {
    margin-top: 10px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .quick-chip {
    background: #334155;
    color: #94A3B8;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
  }
  .quick-chip:hover {
    background: #38BDF8;
    color: #0F172A;
    font-weight: bold;
  }

  /* TARJETA DIGITAL DE ENTREGA */
  .card-container {
    width: 100%;
    max-width: 480px;
    background: #FFFFFF;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .header {
    background: linear-gradient(135deg, #1E3A8A, #0D9488);
    color: white;
    padding: 18px 16px;
    text-align: center;
    position: relative;
  }
  .header h2 { font-size: 17px; letter-spacing: 0.5px; margin-bottom: 2px; }
  .header p { font-size: 12px; opacity: 0.85; }
  .tag-pill {
    position: absolute;
    top: 14px;
    right: 14px;
    background: #F59E0B;
    color: #1E293B;
    font-size: 11px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 12px;
    font-family: monospace;
  }

  .student-section {
    padding: 16px 20px;
    text-align: center;
    border-bottom: 1px solid #F1F5F9;
  }
  .avatar-circle {
    width: 64px;
    height: 64px;
    background: #E0F2FE;
    color: #0369A1;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 8px auto;
    border: 3px solid #BAE6FD;
  }
  .student-name {
    font-size: 20px;
    font-weight: 800;
    color: #1E3A8A;
    margin-bottom: 6px;
  }
  .meta-chips {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chip {
    background: #F1F5F9;
    color: #334155;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
  }

  .details-body {
    padding: 16px 20px;
  }
  .field-row {
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px dashed #E2E8F0;
    padding-bottom: 6px;
  }
  .field-label {
    font-size: 12px;
    font-weight: 700;
    color: #64748B;
  }
  .field-value {
    font-size: 13px;
    font-weight: 700;
    color: #0F172A;
    text-align: right;
  }

  .auth-section-title {
    font-size: 11px;
    font-weight: 800;
    color: #166534;
    text-transform: uppercase;
    margin-top: 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .auth-item {
    background: #F0FDF4;
    border: 1.5px solid #86EFAC;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .auth-thumb {
    width: 85px;
    height: 56px;
    border-radius: 6px;
    object-fit: cover;
    border: 1.5px solid #16A34A;
    background: #E2E8F0;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .auth-thumb:hover {
    transform: scale(1.05);
  }
  .auth-info { flex: 1; }
  .auth-name {
    font-size: 13px;
    font-weight: 800;
    color: #15803D;
    line-height: 1.2;
  }
  .auth-role {
    font-size: 11px;
    font-weight: 600;
    color: #475569;
    margin-top: 2px;
  }
  .auth-badge {
    display: inline-block;
    background: #DCFCE7;
    color: #166534;
    font-size: 10px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 4px;
    margin-top: 4px;
  }

  .footer {
    background: #F8FAFC;
    padding: 10px;
    text-align: center;
    font-size: 11px;
    color: #64748B;
    border-top: 1px solid #E2E8F0;
    font-weight: 600;
  }

  /* MODAL PARA AMPLIAR INE */
  .modal {
    display: none;
    position: fixed;
    z-index: 999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .modal img {
    max-width: 95%;
    max-height: 80vh;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 2px solid white;
  }
</style>
</head>
<body>

  <!-- PANEL DE BÚSQUEDA -->
  <div class="search-panel">
    <h3>🔍 Buscador Manual de Alumno</h3>
    <div class="search-box">
      <input type="text" id="inputBusqueda" class="search-input" placeholder="Nombre, Lista # o ID NFC (ej. 101, Mateo)...">
      <button class="search-btn" onclick="buscarManual()">Buscar</button>
    </div>
    <div class="quick-list">
      <span class="quick-chip" onclick="cargarAlumno('NFC-101')">Mateo (NFC-101)</span>
      <span class="quick-chip" onclick="cargarAlumno('NFC-102')">Sofía (NFC-102)</span>
      <span class="quick-chip" onclick="cargarAlumno('NFC-103')">Emiliano (NFC-103)</span>
    </div>
  </div>

  <!-- TARJETA DEL ALUMNO -->
  <div class="card-container">
    <div class="header">
      <span id="txtTag" class="tag-pill">NFC</span>
      <h2>🏫 CONTROL DE ENTREGA</h2>
      <p>Validación de Identidad y Salida</p>
    </div>

    <div class="student-section">
      <div class="avatar-circle">👦</div>
      <div id="txtNombre" class="student-name">Cargando...</div>
      <div class="meta-chips">
        <div id="txtGradoSec" class="chip">Grado</div>
        <div id="txtLista" class="chip">Lista #</div>
      </div>
    </div>

    <div class="details-body">
      <div class="field-row">
        <span class="field-label">👨 Papá</span>
        <span id="txtPapa" class="field-value">-</span>
      </div>

      <div class="field-row">
        <span class="field-label">👩 Mamá</span>
        <span id="txtMama" class="field-value">-</span>
      </div>

      <div class="field-row">
        <span class="field-label">📞 Tel. Contacto</span>
        <span id="txtTel" class="field-value">-</span>
      </div>

      <div class="auth-section-title">🟢 Personas Autorizadas (INE Verificada):</div>
      <div id="contenedorAutorizados"></div>
    </div>

    <div class="footer">
      🕒 Escaneado a las <span id="txtHora">--:--</span> • Identidad Validada
    </div>
  </div>

  <!-- MODAL PARA FOTO INE -->
  <div id="modalIne" class="modal" onclick="cerrarModal()">
    <img id="imgModal" src="" alt="Credencial INE">
  </div>

<script>
  const padron = [
    {
      id: "NFC-101",
      nombre: "Mateo Garza Sánchez",
      grado: "3° de Primaria",
      sec: "A",
      lista: "14",
      papa: "Carlos Garza Méndez",
      mama: "Ana Sánchez Flores",
      tel: "844-123-4567",
      autorizados: [
        {
          nombre: "Ana Sánchez Flores",
          parentesco: "Mamá",
          ine: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=400&q=80"
        },
        {
          nombre: "María López Alvarado",
          parentesco: "Abuela Materna",
          ine: "https://images.unsplash.com/photo-1567532939604-b6b5b0db2604?auto=format&fit=crop&w=400&q=80"
        }
      ]
    },
    {
      id: "NFC-102",
      nombre: "Sofía Martínez López",
      grado: "1° de Primaria",
      sec: "B",
      lista: "08",
      papa: "Roberto Martínez Ruiz",
      mama: "Lucía López Pérez",
      tel: "844-765-4321",
      autorizados: [
        {
          nombre: "Roberto Martínez Ruiz",
          parentesco: "Papá",
          ine: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=400&q=80"
        },
        {
          nombre: "Elena Ruiz Valdés",
          parentesco: "Tía",
          ine: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=400&q=80"
        }
      ]
    },
    {
      id: "NFC-103",
      nombre: "Emiliano Rodríguez Ramos",
      grado: "2° de Primaria",
      sec: "A",
      lista: "22",
      papa: "Jorge Rodríguez Torres",
      mama: "Laura Ramos Morales",
      tel: "844-987-6543",
      autorizados: [
        {
          nombre: "Laura Ramos Morales",
          parentesco: "Mamá",
          ine: "https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=400&q=80"
        },
        {
          nombre: "Fernando Ramos Morales",
          parentesco: "Tío",
          ine: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80"
        }
      ]
    }
  ];

  function mostrarDatos(alumno) {
    if (alumno) {
      document.getElementById('txtTag').innerText = alumno.id;
      document.getElementById('txtNombre').innerText = alumno.nombre;
      document.getElementById('txtGradoSec').innerText = `${alumno.grado} "${alumno.sec}"`;
      document.getElementById('txtLista').innerText = `Lista #${alumno.lista}`;
      document.getElementById('txtPapa').innerText = alumno.papa;
      document.getElementById('txtMama').innerText = alumno.mama;
      document.getElementById('txtTel').innerText = alumno.tel;

      const cont = document.getElementById('contenedorAutorizados');
      cont.innerHTML = '';
      alumno.autorizados.forEach(aut => {
        cont.innerHTML += `
          <div class="auth-item">
            <img src="${aut.ine}" class="auth-thumb" alt="INE ${aut.nombre}" title="Clic para ampliar foto" onclick="ampliarFoto('${aut.ine}')">
            <div class="auth-info">
              <div class="auth-name">${aut.nombre}</div>
              <div class="auth-role">Parentesco: <b>${aut.parentesco}</b></div>
              <span class="auth-badge">🪪 INE Registrada</span>
            </div>
          </div>
        `;
      });
    } else {
      document.getElementById('txtNombre').innerText = "❌ Alumno No Encontrado";
      document.getElementById('txtGradoSec').innerText = "Sin Datos";
      document.getElementById('txtLista').innerText = "-";
      document.getElementById('txtPapa').innerText = "-";
      document.getElementById('txtMama').innerText = "-";
      document.getElementById('txtTel').innerText = "-";
      document.getElementById('contenedorAutorizados').innerHTML = '<p style="color:#64748B; font-size:12px; text-align:center; padding:10px;">No se encontró ningún registro con ese criterio de búsqueda.</p>';
    }
  }

  function cargarAlumno(id) {
    const alumno = padron.find(a => a.id.toUpperCase() === id.toUpperCase());
    mostrarDatos(alumno);
  }

  function buscarManual() {
    const term = document.getElementById('inputBusqueda').value.trim().toLowerCase();
    if (!term) return;
    const encontrado = padron.find(a => 
      a.nombre.toLowerCase().includes(term) ||
      a.id.toLowerCase().includes(term) ||
      a.lista === term
    );
    mostrarDatos(encontrado);
  }

  // Escucha presionar ENTER en la casilla de búsqueda
  document.getElementById('inputBusqueda').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') buscarManual();
  });

  // Lectura por parámetro URL de la tarjeta NFC
  const params = new URLSearchParams(window.location.search);
  const tagBuscado = params.get('id') || 'NFC-101';
  cargarAlumno(tagBuscado);

  const ahora = new Date();
  document.getElementById('txtHora').innerText = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  function ampliarFoto(url) {
    document.getElementById('imgModal').src = url;
    document.getElementById('modalIne').style.display = 'flex';
  }

  function cerrarModal() {
    document.getElementById('modalIne').style.display = 'none';
  }
</script>
</body>
</html>
